name: Validar sitio

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

env:
  SITE_URL: ${{ vars.SITE_URL }}
  BASE_PATH: ${{ vars.BASE_PATH }}
  PUBLIC_SITE_LIVE: ${{ vars.PUBLIC_SITE_LIVE }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Generar sitio
        run: npm run build

      - name: Revisar rastreo, sitemap, schema y analítica
        run: node scripts/check-discovery.mjs
